name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (MSYS2 UCRT64)
    runs-on: windows-latest
    env:
      # Test output can contain non-ASCII text; the CI console defaults to cp1252, so force UTF-8 for Python
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSYS2 (UCRT64 toolchain + LLVM)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-python

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Version
        run: ./build/muc.exe --version

      - name: Run regression tests
        run: |
          export MUC_CMD="$PWD/build/muc.exe"
          python tests/run_tests.py

      - name: CLI target/platform checks
        run: |
          export MUC_CMD="$PWD/build/muc.exe"
          python tests/cli/target_platform.py

  build-test-linux:
    name: build & test (Ubuntu, LLVM dev)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # `llvm-dev` bundles `llvm-config`, which is what the CMake configure step needs; the runtime
      # platform layer (pthread + ucontext + glibc declarations) is exercised by the same suite.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build llvm-dev clang

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$(llvm-config --cmakedir)"

      - name: Build
        run: cmake --build build

      - name: Version
        run: ./build/muc --version

      - name: Run regression tests
        run: |
          export MUC_CMD="$PWD/build/muc"
          python3 tests/run_tests.py

      - name: CLI target/platform checks
        run: |
          export MUC_CMD="$PWD/build/muc"
          python3 tests/cli/target_platform.py
